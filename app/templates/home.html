{% extends "base.html" %}
{% block title %}Math Quiz — Home{% endblock %}
{% block content %}
<section class="hero">
  <h1>Math Quiz</h1>
  <p class="lede">Practice mental math with a short timed quiz.</p>
  <ul class="rules">
    <li>{{ quiz_length }} questions</li>
    <li>{{ time_limit }} seconds total</li>
    <li>Operations: +, −, ×, ÷ (integer answers)</li>
  </ul>
  <form action="{{ url_for('quiz.start_quiz') }}" method="post">
    <button type="submit" class="btn primary">Start Quiz</button>
  </form>
</section>
{% endblock %}
