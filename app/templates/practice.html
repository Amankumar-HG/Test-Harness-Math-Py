{% extends "base.html" %}
{% block title %}Practice — {{ skill.name }}{% endblock %}
{% block content %}
<section class="practice">
  <div class="practice-card">
    <div class="meta-row">
      <span class="chip">{{ skill.name }}</span>
      <span class="chip">{{ difficulty_label }}</span>
      <span class="chip">Question {{ progress }} of {{ total }}</span>
      <span class="chip">{{ correct_so_far }} correct so far</span>
    </div>

    <div class="session-meter" aria-hidden="true">
      <div class="meter-fill" style="width: {{ ((progress - 1) / total) * 100 }}%"></div>
    </div>

    <h1 class="prompt">{{ item.prompt }}</h1>
    <p class="hint">{{ item.hint }}</p>

    <form action="{{ url_for('ape.practice_answer') }}" method="post" class="answer-form">
      <label for="answer">Your answer</label>
      <div class="answer-row">
        <input
          id="answer"
          name="answer"
          type="text"
          inputmode="{% if item.answer_type == 'fraction' %}text{% else %}numeric{% endif %}"
          autocomplete="off"
          autofocus
          required
          placeholder="{% if item.answer_type == 'fraction' %}Example: 3/4{% else %}Enter a number{% endif %}"
        >
        <button type="submit" class="btn primary">Submit</button>
      </div>
    </form>
  </div>
</section>
{% endblock %}
